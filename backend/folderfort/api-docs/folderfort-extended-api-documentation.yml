openapi: 3.0.0
info:
  description: "Complete Folderfort API Documentation including multipart uploads, notifications, space usage, and empty trash functionality. Access token should be sent along with every request to SITE_NAME API in authorization header: `Authorization: Bearer <Token>` <br> This token can either be acquired via `auth/login` endpoint or from account settings page on [SITE_NAME website](SITE_URL/account-settings)."
  version: "1.2.0"
  title: SITE_NAME API - Extended Documentation
security:
  - accessToken: []
tags:
  - name: Uploads
    description: Upload files to SITE_NAME
  - name: Multipart Uploads
    description: S3-style multipart upload for large files
  - name: Auth
    description: Authenticate requests to the API
  - name: Files and Folders
    description: FileEntry refers to either a file or folder on SITE_NAME
  - name: Sharing
    description: Manage file entry collaborators
  - name: Starring
    description: Mark or unmark entries as starred
  - name: Shareable Links
    description: Manage shareable links for file or folder
  - name: Notifications
    description: Retrieve user notifications
  - name: User Management
    description: User account and storage management
  - name: Trash Management
    description: Enhanced trash operations including empty trash

paths:
  # Multipart Upload Endpoints
  /s3/multipart/create:
    post:
      tags:
        - Multipart Uploads
      summary: Create a multipart upload session
      description: Initiates a new multipart upload session for large files. Returns upload session details including upload ID and S3 key.
      operationId: createMultipartUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - size
                - mime
                - extension
                - parentId
                - disk
              properties:
                filename:
                  type: string
                  description: Name of the file to upload
                  example: "large_video.mp4"
                mime:
                  type: string
                  description: MIME type of the file
                  example: "video/mp4"
                size:
                  type: integer
                  format: int64
                  description: Total size of the file in bytes
                  example: 125829120
                extension:
                  type: string
                  description: File extension
                  example: "mp4"
                workspaceId:
                  type: integer
                  description: Workspace ID where file should be uploaded
                  example: 0
                parentId:
                  type: integer
                  description: ID of parent folder where file should be uploaded
                  example: 2745700
                relativePath:
                  type: string
                  description: Relative path within the parent folder
                  example: ""
                disk:
                  type: string
                  description: Storage disk identifier
                  example: "uploads"
      responses:
        "200":
          description: Multipart upload session created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  key:
                    type: string
                    description: S3 object key for the upload
                    example: "uploads/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea"
                  uploadId:
                    type: string
                    description: Unique identifier for the multipart upload session
                    example: "4_zd686297fa8fe0e5d93160a12_f2347c892e012e2d4_d20250807_m155244_c003_v0312006_t0020_u01754581964571"
                  acl:
                    type: string
                    description: Access control level for the upload
                    example: "private"
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"
        "422":
          $ref: "#/components/schemas/422-Response"

  /s3/multipart/batch-sign-part-urls:
    post:
      tags:
        - Multipart Uploads
      summary: Get signed URLs for multipart upload parts
      description: Returns signed URLs for uploading specific parts of a multipart upload. Each part can be up to 5GB in size.
      operationId: batchSignPartUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partNumbers
                - uploadId
                - key
              properties:
                partNumbers:
                  type: array
                  description: Array of part numbers to generate signed URLs for
                  items:
                    type: integer
                    minimum: 1
                    maximum: 10000
                  example: [1, 2, 3, 4, 5, 6]
                uploadId:
                  type: string
                  description: Upload ID from the multipart create response
                  example: "4_zd686297fa8fe0e5d93160a12_f2347c892e012e2d4_d20250807_m155244_c003_v0312006_t0020_u01754581964571"
                key:
                  type: string
                  description: S3 object key from the multipart create response
                  example: "uploads/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea"
      responses:
        "200":
          description: Signed URLs generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  urls:
                    type: array
                    description: Array of signed URLs for each requested part
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Pre-signed URL for uploading this part
                          example: "https://folderfort-eu-2.s3.eu-central-003.backblazeb2.com/uploads/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea?uploadId=..."
                        partNumber:
                          type: integer
                          description: Part number for this URL
                          example: 1
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"
        "422":
          $ref: "#/components/schemas/422-Response"

  /s3/multipart/complete:
    post:
      tags:
        - Multipart Uploads
      summary: Complete a multipart upload
      description: Finalizes a multipart upload by providing ETags for all uploaded parts. The file will be assembled and made available.
      operationId: completeMultipartUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - uploadId
                - parts
              properties:
                key:
                  type: string
                  description: S3 object key from the multipart create response
                  example: "uploads/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea"
                uploadId:
                  type: string
                  description: Upload ID from the multipart create response
                  example: "4_zd686297fa8fe0e5d93160a12_f2347c892e012e2d4_d20250807_m155244_c003_v0312006_t0020_u01754581964571"
                parts:
                  type: array
                  description: Array of completed parts with their ETags
                  items:
                    type: object
                    required:
                      - ETag
                      - PartNumber
                    properties:
                      ETag:
                        type: string
                        description: ETag returned by S3 after uploading the part
                        example: "\"8f4e33f3dc3e414ff94e5fb6905cba8c\""
                      PartNumber:
                        type: integer
                        description: Part number (1-based)
                        example: 1
      responses:
        "200":
          description: Multipart upload completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  location:
                    type: string
                    description: Final location/path of the uploaded file
                    example: "/uploads/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea/be325ba9-c9b8-45e5-83bb-43aa0bbd3cea"
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"
        "422":
          $ref: "#/components/schemas/422-Response"

  /s3/entries:
    post:
      tags:
        - Multipart Uploads
      summary: Create file entry after multipart upload completion
      description: Creates a file entry record in the database after a multipart upload has been completed. This is the final step in the multipart upload process to register the uploaded file.
      operationId: createS3Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - size
                - clientMime
                - clientName
                - clientExtension
                - disk
              properties:
                workspaceId:
                  type: integer
                  description: Workspace ID where file should be registered
                  example: 0
                parentId:
                  type: string
                  description: ID of parent folder (can be empty string for root)
                  example: ""
                relativePath:
                  type: string
                  description: Relative path within the parent folder
                  example: ""
                disk:
                  type: string
                  description: Storage disk identifier
                  example: "uploads"
                clientMime:
                  type: string
                  description: Original MIME type from client
                  example: "application/octet-stream"
                clientName:
                  type: string
                  description: Original filename from client
                  example: "120mb_test.bin"
                filename:
                  type: string
                  description: Internal server filename (UUID from multipart upload)
                  example: "51df3900-b516-4d4f-9c7e-338bbc491192"
                size:
                  type: integer
                  format: int64
                  description: Total size of the uploaded file in bytes
                  example: 125829120
                clientExtension:
                  type: string
                  description: Original file extension from client
                  example: "bin"
      responses:
        "200":
          description: File entry created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  fileEntry:
                    $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"
        "422":
          $ref: "#/components/schemas/422-Response"

  # User Space Usage
  /user/space-usage:
    get:
      tags:
        - User Management
      summary: Get user storage space usage
      description: Retrieve information about the user's storage space usage and availability
      operationId: getUserSpaceUsage
      responses:
        "200":
          description: Space usage retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  used:
                    type: integer
                    format: int64
                    description: Used storage space in bytes
                    example: 37697127677
                  available:
                    type: integer
                    format: int64
                    description: Total available storage space in bytes
                    example: 1099511627776
                  seo:
                    type: object
                    nullable: true
                    example: null
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"

  # Enhanced Delete/Empty Trash
  /file-entries/delete:
    post:
      tags:
        - Trash Management
      summary: Delete entries or empty trash completely
      description: Enhanced delete operation that can either delete specific entries or empty the entire trash. Note - The API specification shows DELETE /file-entries but the actual implementation uses POST /file-entries/delete.
      operationId: deleteEntriesOrEmptyTrash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryIds:
                  description: List of entry IDs to delete (can be empty when emptying trash)
                  type: array
                  items:
                    type: integer
                deleteForever:
                  description: Whether entries should be deleted permanently, instead of being moved to trash
                  type: boolean
                  example: false
                emptyTrash:
                  description: When true, empties the entire trash regardless of entryIds
                  type: boolean
                  example: true
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"
        "422":
          $ref: "#/components/schemas/422-Response"

  # Legacy endpoints from original API (included for completeness)
  /uploads:
    post:
      tags:
        - Uploads
      summary: Upload a file to SITE_NAME (simple upload)
      description: Simple file upload for smaller files. For large files, use multipart upload instead.
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Content of file to upload to SITE_NAME
                parentId:
                  type: integer
                  description: ID of folder where this file should be uploaded, `null` will upload to root
                  example: null
                relativePath:
                  type: string
                  description: "Folders in the path provided here will be auto created, if they don't exist already. This is mainly useful when uploading a folder from browser. It should include original filename as well: <br> `/some/folders/here/file-name.jpg`"
      responses:
        "201":
          description: File was uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  fileEntry:
                    $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          description: Insufficient credits for this file upload. Please purchase more credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/403-Response"
        "422":
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/422-Response"

  /drive/file-entries:
    get:
      tags:
        - Files and Folders
      summary: Get file entries
      description: Get the list of all file entries you have access to
      operationId: indexEntry
      parameters:
        - name: perPage
          in: query
          description: How many entries to return per page
          schema:
            type: "integer"
            format: "int64"
            default: 50
        - name: deletedOnly
          in: query
          description: Whether only trashed entries should be returned
          schema:
            type: "boolean"
        - name: starredOnly
          in: query
          description: Whether only starred entries should be returned
          schema:
            type: "boolean"
        - name: recentOnly
          in: query
          description: Whether only recent entries should be returned
          schema:
            type: "boolean"
        - name: sharedOnly
          in: query
          description: Whether only entries that have been shared with you should be returned
          schema:
            type: "boolean"
        - name: query
          in: query
          description: Search query entry names should be filtered on
          schema:
            type: "string"
        - name: type
          in: query
          description: File type entries should be filtered on
          schema:
            type: "string"
            enum:
              - "folder"
              - "image"
              - "text"
              - "audio"
              - "video"
              - "pdf"
        - name: parentIds
          in: query
          description: Only entries that are children of specified folders will be returned
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: workspaceId
          in: query
          description: Only return entries in specified workspace
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/schemas/401-Response"
        "403":
          $ref: "#/components/schemas/403-Response"

components:
  schemas:
    FileEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: image.png
        file_name:
          type: string
          example: j6oWHDG1z613UqFHLZpE1Yrqngw0N8XLuGNLNWJV
          description: actual file name for this entry on storage
        file_size:
          type: integer
          format: int64
          example: 111863
          description: In bytes
        parent_id:
          type: integer
          format: int64
          example: 1
          description: Parent folder ID
        parent:
          $ref: "#/components/schemas/FileEntry"
        thumbnail:
          type: string
          example: thumbnail.png
          description: Relative path to thumbnail image for the file (if it exists)
        mime:
          type: string
          example: image/png
        url:
          type: string
          example: secure/uploads/3260
          description: relative url for previewing file or folder contents
        hash:
          type: string
          example: MzI2MHxwYWRkaQ
        type:
          type: string
          enum:
            - "image"
            - "folder"
            - "text"
            - "audio"
            - "video"
            - "pdf"
        description:
          type: string
          example: Example description entered by user
        deleted_at:
          type: string
          example: "2021-02-23T14:42:38.000000Z"
          description: date entry was moved to trash (if it's in trash currently)
        created_at:
          type: string
          example: "2021-02-23T14:42:38.000000Z"
          description: date entry was uploaded
        updated_at:
          type: string
          example: "2021-02-23T14:42:38.000000Z"
          description: date entry was last modified (content, name or location changed)
        path:
          type: string
          example: "3260/3261/3262"
          description: full path of parent folder IDs for this entry up to root
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              email:
                type: string
                example: "example@gmail.com"

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_token:
          type: string
          description: Access token that can be used to authenticate API requests for this user
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          example: "2021-02-23T14:42:38.000000Z"
        updated_at:
          type: string
          example: "2021-02-23T14:42:38.000000Z"
        
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: Tag

    ShareableLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
          example: 3h8N1nxZq7WtyRmXDIosFupSl9MCrD
          description: ID for link that will be visible in url
        password:
          type: string
          example: $2y$10$BI8kz6zFeB0CA0P425eMSe7KJcm8OKjWijHTQrRP.cjqRtynMq4Sy
          description: Passwords are hashed, so this will not match the password that was entered in plain text
        user_id:
          type: integer
          format: int64
          description: ID of user that created this link
        entry_id:
          type: integer
          format: int64
          description: ID of file entry this link is attached to
        entry:
          $ref: "#/components/schemas/FileEntry"
        expires_at:
          type: string
          example: "2021-03-06T17:34:00.000000Z"
        allow_edit:
          type: boolean
          example: false
        allow_download:
          type: boolean
          example: false

    Shareable-Link-Response:
      type: object
      properties:
        status:
          type: string
          example: success
        link:
          $ref: "#/components/schemas/ShareableLink"
        folderChildren:
          description: If link is for folder, this will list immediate children of that folder
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        errors:
          type: object
          properties:
            some_data_1:
              type: string
              example: Error message for data 1
            some_data_2:
              type: string
              example: Error message for data 2

    401-Response:
      description: Unauthenticated. Either access token is not provided or is invalid.
    403-Response:
      description: Unauthorized access. You don't have permissions required to perform this operation.
    422-Response:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: "Reason for the error"
        errors:
          type: object
          properties:
            some_data_1:
              type: string
              example: Error message for data 1
            some_data_2:
              type: string
              example: Error message for data 2

  securitySchemes:
    accessToken:
      type: http
      scheme: bearer

# Important Implementation Notes:
# - FolderFort doesn't support directory names less than 3 characters
# - FolderFort API doesn't handle backslashes properly in filenames but apparently works fine in directory names
# - The actual implementation uses POST /file-entries/delete but the API specification shows DELETE /file-entries
# 
# Multipart Upload Process:
# 1. Create multipart upload session (/s3/multipart/create)
# 2. Get signed URLs for parts (/s3/multipart/batch-sign-part-urls) 
# 3. Upload parts directly to S3 using PUT requests to signed URLs
# 4. Complete multipart upload (/s3/multipart/complete) with ETags
# 5. Create file entry record (/s3/entries) to register the file in the system